# Transformer config for this reimplementation.
#
# Architecture (model/*.py) is a faithful implementation of "Attention Is All
# You Need" Section 3. Hyperparameters below are scaled down from the paper's
# base model to match Multi30k (~29K sentence pairs) and single-GPU training,
# instead of the paper's WMT 2014 (~4.5M pairs) on 8 GPUs. Paper's original
# base-model values are shown as comments for reference.

d_model: 256       # paper base: 512
num_heads: 8        # paper base: 8 (unchanged)
num_layers: 3        # paper base: 6
d_ff: 1024           # paper base: 2048
dropout: 0.1          # paper base: 0.1 (unchanged)
label_smoothing: 0.1   # paper base: 0.1 (unchanged)

batch_size: 64
warmup_steps: 1000    # paper base: 4000 (scaled down for fewer total training steps)
max_len: 128
vocab_size: 8000       # paper base (shared EN-DE vocab): ~37000

num_epochs: 20
pad_idx: 0
checkpoint_dir: checkpoints